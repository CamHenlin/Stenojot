<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transcription Viewer</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      height: 100vh;
      overflow: hidden;
    }

    #app {
      display: flex;
      height: 100vh;
    }

    /* --- Sidebar --- */
    .sidebar {
      width: 240px;
      min-width: 240px;
      background: #1a1a1a;
      border-right: 1px solid #2a2a2a;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid #2a2a2a;
    }

    .sidebar-header h2 {
      font-size: 14px;
      font-weight: 600;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .search-input {
      width: 100%;
      padding: 8px 12px;
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }

    .search-input:focus {
      border-color: #5b8def;
    }

    .search-input::placeholder {
      color: #666;
    }

    .date-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .date-item {
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      color: #bbb;
      transition: background 0.1s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .date-item:hover {
      background: #252525;
    }

    .date-item.active {
      background: #1e3a5f;
      color: #7bb8f5;
    }

    .date-item .label {
      font-weight: 500;
    }

    /* --- Main content --- */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .toolbar {
      padding: 12px 20px;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1a1a1a;
    }

    .toolbar-title {
      font-size: 15px;
      font-weight: 600;
      color: #ccc;
    }

    .toolbar-count {
      font-size: 12px;
      color: #666;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 0 20px;
    }

    .message {
      padding: 8px 0;
      display: flex;
      gap: 12px;
      line-height: 1.5;
    }

    .message + .message {
      border-top: 1px solid #1a1a1a;
    }

    .message-time {
      font-size: 12px;
      color: #666;
      font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
      white-space: nowrap;
      padding-top: 2px;
      min-width: 70px;
    }

    .message-text {
      font-size: 14px;
      color: #e0e0e0;
    }

    .message-text mark {
      background: #5b8def33;
      color: #7bb8f5;
      border-radius: 2px;
      padding: 0 2px;
    }

    /* --- Annotations --- */
    .annotation-row {
      padding: 6px 0;
      display: flex;
      gap: 12px;
      line-height: 1.5;
      align-items: flex-start;
    }

    .annotation-marker {
      font-size: 12px;
      color: #d4a04a;
      font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
      white-space: nowrap;
      padding-top: 2px;
      min-width: 70px;
    }

    .annotation-text {
      font-size: 14px;
      color: #d4a04a;
      white-space: pre-wrap;
      flex: 1;
      cursor: pointer;
      border-radius: 4px;
      padding: 2px 4px;
      margin: -2px -4px;
    }

    .annotation-text:hover {
      background: #d4a04a10;
    }

    .annotation-edit-input {
      flex: 1;
      padding: 6px 10px;
      background: #1a1a1a;
      border: 1px solid #d4a04a55;
      border-radius: 4px;
      color: #d4a04a;
      font-size: 14px;
      outline: none;
      font-family: inherit;
      resize: none;
      overflow: hidden;
      white-space: pre-wrap;
      min-height: 30px;
      line-height: 1.5;
    }

    .annotation-edit-input:focus {
      border-color: #d4a04a;
    }

    .annotation-delete {
      background: none;
      border: none;
      color: #666;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.1s;
      flex-shrink: 0;
    }

    .annotation-row:hover .annotation-delete {
      opacity: 1;
    }

    .annotation-delete:hover {
      color: #e55;
      background: #e5535520;
    }

    /* --- Insert zone (clickable gap between messages) --- */
    .insert-zone {
      height: 4px;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.15s;
      position: relative;
    }

    .insert-zone:hover {
      height: 8px;
      background: #d4a04a30;
    }

    .insert-zone:hover::after {
      content: '+';
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: #d4a04a;
      font-size: 14px;
      font-weight: bold;
    }

    /* --- Inline annotation input --- */
    .inline-annotation-input {
      display: flex;
      gap: 8px;
      padding: 6px 0;
      align-items: flex-start;
    }

    .inline-annotation-input textarea {
      flex: 1;
      padding: 6px 10px;
      background: #1a1a1a;
      border: 1px solid #d4a04a55;
      border-radius: 4px;
      color: #d4a04a;
      font-size: 13px;
      outline: none;
      font-family: inherit;
      resize: none;
      overflow: hidden;
      min-height: 30px;
      line-height: 1.5;
    }

    .inline-annotation-input textarea:focus {
      border-color: #d4a04a;
    }

    .inline-annotation-input textarea::placeholder {
      color: #d4a04a55;
    }

    .inline-save-btn {
      padding: 5px 12px;
      background: #d4a04a;
      border: none;
      border-radius: 4px;
      color: #111;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .inline-save-btn:hover {
      background: #e0b05a;
    }

    .inline-save-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .inline-cancel-btn {
      background: none;
      border: 1px solid #3a3a3a;
      color: #888;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 4px 8px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .inline-cancel-btn:hover {
      color: #e55;
      border-color: #e5535550;
      background: #e5535515;
    }

    /* --- Bottom annotation panel --- */
    .bottom-annotation {
      border-top: 1px solid #2a2a2a;
      padding: 12px 20px;
      background: #1a1a1a;
    }

    .bottom-annotation-label {
      font-size: 11px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .bottom-annotation-area {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .bottom-annotation-area textarea {
      flex: 1;
      padding: 8px 10px;
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      color: #d4a04a;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      resize: vertical;
      min-height: 40px;
      max-height: 200px;
      tab-size: 2;
    }

    .bottom-annotation-area textarea:focus {
      border-color: #d4a04a;
    }

    .bottom-annotation-area textarea::placeholder {
      color: #666;
    }

    .save-btn {
      padding: 8px 16px;
      background: #d4a04a;
      border: none;
      border-radius: 6px;
      color: #111;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      align-self: flex-end;
    }

    .save-btn:hover {
      background: #e0b05a;
    }

    .save-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      font-size: 14px;
    }

    /* scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #444; }
  </style>
</head>
<body>
  <div id="app">
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>Transcriptions</h2>
        <input
          class="search-input"
          type="text"
          placeholder="Search messages..."
          v-model="searchInput"
          @input="onSearchInput"
        >
      </div>
      <div class="date-list">
        <div
          class="date-item"
          :class="{ active: selectedDate === null && !searchInput }"
          @click="selectAll"
        >
          <span class="label">All Messages</span>
        </div>
        <div
          v-for="d in dates"
          :key="d"
          class="date-item"
          :class="{ active: selectedDate === d }"
          @click="selectDate(d)"
        >
          <span class="label">{{ formatDateLabel(d) }}</span>
        </div>
      </div>
    </div>

    <div class="main">
      <div class="toolbar">
        <span class="toolbar-title">{{ toolbarTitle }}</span>
        <span class="toolbar-count">{{ transcriptionCount }} message{{ transcriptionCount === 1 ? '' : 's' }}</span>
      </div>

      <div v-if="items.length === 0 && !loading" class="empty-state">
        <span>No transcriptions found.</span>
      </div>
      <div v-else-if="items.length === 0 && loading" class="empty-state">
        <span>Loading...</span>
      </div>

      <div v-else class="messages" ref="messagesEl">
        <template v-for="(item, idx) in items" :key="item.kind + '-' + item.id">
          <!-- Insert zone before first item -->
          <template v-if="idx === 0 && item.kind === 'transcription'">
            <div
              v-if="inlineInsertAt !== 'before-' + item.id"
              class="insert-zone"
              @click="openInlineInsert('before-' + item.id, null)"
            ></div>
            <div v-else class="inline-annotation-input">
              <textarea
                ref="inlineInputEl"
                placeholder="Add note..."
                v-model="inlineText"
                @keydown="handleInlineKeydown($event, null)"
                @input="autoResizeInline"
                rows="1"
              ></textarea>
              <button class="inline-save-btn" :disabled="!inlineText.trim()" @click="saveInlineAnnotation(null)">Save</button>
              <button class="inline-cancel-btn" title="Cancel" @click="closeInlineInsert">&times;</button>
            </div>
          </template>

          <!-- Annotation row -->
          <div v-if="item.kind === 'annotation'" class="annotation-row">
            <span class="annotation-marker">note</span>
            <template v-if="editingAnnotationId === item.id">
              <textarea
                ref="editInputEl"
                class="annotation-edit-input"
                v-model="editingText"
                @keydown="handleEditKeydown($event, item.id)"
                @input="autoResizeEdit"
              ></textarea>
              <button class="inline-save-btn" :disabled="!editingText.trim()" @click="saveEdit(item.id)">Save</button>
              <button class="inline-cancel-btn" title="Cancel" @click="cancelEdit">&times;</button>
            </template>
            <template v-else>
              <span class="annotation-text" v-html="highlightText(item.text)" @click="startEdit(item)"></span>
              <button class="annotation-delete" title="Delete annotation" @click="deleteAnnotation(item.id)">&times;</button>
            </template>
          </div>

          <!-- Transcription row -->
          <div v-if="item.kind === 'transcription'" class="message">
            <span class="message-time">{{ formatTime(item.timestamp) }}</span>
            <span class="message-text" v-html="highlightText(item.text)"></span>
          </div>

          <!-- Insert zone after each transcription -->
          <template v-if="item.kind === 'transcription'">
            <div
              v-if="inlineInsertAt !== 'after-' + item.id"
              class="insert-zone"
              @click="openInlineInsert('after-' + item.id, item.id)"
            ></div>
            <div v-else class="inline-annotation-input">
              <textarea
                ref="inlineInputEl"
                placeholder="Add note..."
                v-model="inlineText"
                @keydown="handleInlineKeydown($event, item.id)"
                @input="autoResizeInline"
                rows="1"
              ></textarea>
              <button class="inline-save-btn" :disabled="!inlineText.trim()" @click="saveInlineAnnotation(item.id)">Save</button>
              <button class="inline-cancel-btn" title="Cancel" @click="closeInlineInsert">&times;</button>
            </div>
          </template>
        </template>
      </div>

      <!-- Bottom annotation panel -->
      <div class="bottom-annotation">
        <div class="bottom-annotation-label">Add Note</div>
        <div class="bottom-annotation-area">
          <textarea
            ref="bottomTextarea"
            v-model="bottomNoteText"
            placeholder="Type a note... (Enter for new line, Tab for indent)"
            rows="2"
            @keydown="handleBottomKeydown"
          ></textarea>
          <button
            class="save-btn"
            :disabled="!bottomNoteText.trim()"
            @click="saveBottomNote"
          >Save</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref, computed, nextTick, onUnmounted } = Vue;

    createApp({
      setup() {
        const dates = ref([]);
        const transcriptions = ref([]);
        const annotations = ref([]);
        const selectedDate = ref(null);
        const searchInput = ref('');
        const loading = ref(false);
        const messagesEl = ref(null);
        const inlineInputEl = ref(null);
        const bottomTextarea = ref(null);
        const editInputEl = ref(null);

        // Inline annotation state
        const inlineInsertAt = ref(null);
        const inlineText = ref('');

        // Edit annotation state
        const editingAnnotationId = ref(null);
        const editingText = ref('');

        // Bottom note state
        const bottomNoteText = ref('');

        let searchTimeout = null;
        let pollInterval = null;
        const POLL_MS = 2000;

        // Merge transcriptions and annotations into a single sorted list
        const items = computed(() => {
          const result = [];
          const annoByTransId = {};

          // Group annotations by after_transcription_id
          for (const a of annotations.value) {
            const key = a.after_transcription_id ?? '__top__';
            if (!annoByTransId[key]) annoByTransId[key] = [];
            annoByTransId[key].push(a);
          }

          // Annotations anchored before first transcription (after_transcription_id = null)
          if (annoByTransId['__top__']) {
            for (const a of annoByTransId['__top__']) {
              result.push({ kind: 'annotation', ...a });
            }
          }

          // Interleave transcriptions with their trailing annotations
          for (const t of transcriptions.value) {
            result.push({ kind: 'transcription', ...t });
            if (annoByTransId[t.id]) {
              for (const a of annoByTransId[t.id]) {
                result.push({ kind: 'annotation', ...a });
              }
            }
          }

          return result;
        });

        const transcriptionCount = computed(() =>
          transcriptions.value.length
        );

        const toolbarTitle = computed(() => {
          if (searchInput.value) {
            const dateLabel = selectedDate.value
              ? formatDateLabel(selectedDate.value)
              : 'All Messages';
            return `Search: "${searchInput.value}" in ${dateLabel}`;
          }
          if (selectedDate.value) {
            return formatDateLabel(selectedDate.value);
          }
          return 'All Messages';
        });

        function formatDateLabel(dateStr) {
          const [y, m, d] = dateStr.split('-');
          const date = new Date(Number(y), Number(m) - 1, Number(d));
          const today = new Date();
          today.setHours(0, 0, 0, 0);
          const diff = Math.floor((today - date) / 86400000);
          if (diff === 0) return 'Today';
          if (diff === 1) return 'Yesterday';
          return date.toLocaleDateString('en-US', {
            weekday: 'short',
            month: 'short',
            day: 'numeric',
          });
        }

        function formatTime(isoTimestamp) {
          const d = new Date(isoTimestamp);
          return d.toLocaleTimeString('en-US', {
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: false,
          });
        }

        function escapeHtml(str) {
          return str
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
        }

        function highlightText(text) {
          const safe = escapeHtml(text);
          if (!searchInput.value) return safe;
          const term = searchInput.value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const re = new RegExp(`(${term})`, 'gi');
          return safe.replace(re, '<mark>$1</mark>');
        }

        function isScrolledToBottom() {
          const el = messagesEl.value;
          if (!el) return true;
          return el.scrollHeight - el.scrollTop - el.clientHeight < 40;
        }

        async function scrollToBottom() {
          await nextTick();
          if (messagesEl.value) {
            messagesEl.value.scrollTop = messagesEl.value.scrollHeight;
          }
        }

        // --- Data fetching ---

        async function fetchDates() {
          const res = await fetch('/api/dates');
          dates.value = await res.json();
        }

        function buildParams() {
          const params = new URLSearchParams();
          if (selectedDate.value) params.set('date', selectedDate.value);
          if (searchInput.value) params.set('search', searchInput.value);
          return params;
        }

        async function fetchAll() {
          loading.value = true;
          const params = buildParams();
          const qstr = params.toString() ? '?' + params : '';

          const [tRes, aRes] = await Promise.all([
            fetch('/api/transcriptions' + qstr),
            fetch('/api/annotations' + qstr),
          ]);
          transcriptions.value = await tRes.json();
          annotations.value = await aRes.json();
          loading.value = false;
          await scrollToBottom();
          startPolling();
        }

        async function pollNew() {
          const lastTransId = transcriptions.value.length > 0
            ? transcriptions.value[transcriptions.value.length - 1].id
            : 0;
          const lastAnnoId = annotations.value.length > 0
            ? Math.max(...annotations.value.map(a => a.id))
            : 0;

          const params = buildParams();
          const tParams = new URLSearchParams(params);
          tParams.set('after', String(lastTransId));
          const aParams = new URLSearchParams(params);
          aParams.set('after_anno_id', String(lastAnnoId));

          try {
            const [tRes, aRes] = await Promise.all([
              fetch('/api/transcriptions?' + tParams),
              fetch('/api/annotations?' + aParams),
            ]);
            const newTrans = await tRes.json();
            const newAnnos = await aRes.json();
            const hasNew = newTrans.length > 0 || newAnnos.length > 0;
            if (hasNew) {
              const wasAtBottom = isScrolledToBottom();
              if (newTrans.length > 0) {
                transcriptions.value.push(...newTrans);
                fetchDates();
              }
              if (newAnnos.length > 0) {
                annotations.value.push(...newAnnos);
              }
              if (wasAtBottom) await scrollToBottom();
            }
          } catch {
            // ignore
          }
        }

        function startPolling() {
          stopPolling();
          pollInterval = setInterval(pollNew, POLL_MS);
        }

        function stopPolling() {
          if (pollInterval) {
            clearInterval(pollInterval);
            pollInterval = null;
          }
        }

        // --- Navigation ---

        function selectDate(d) {
          selectedDate.value = d;
          closeInlineInsert();
          fetchAll();
        }

        function selectAll() {
          selectedDate.value = null;
          searchInput.value = '';
          closeInlineInsert();
          fetchAll();
        }

        function onSearchInput() {
          clearTimeout(searchTimeout);
          searchTimeout = setTimeout(() => fetchAll(), 250);
        }

        // --- Inline annotations ---

        async function openInlineInsert(key, afterId) {
          inlineInsertAt.value = key;
          inlineText.value = '';
          await nextTick();
          // inlineInputEl is an array of refs due to v-for
          const els = inlineInputEl.value;
          if (els) {
            const el = Array.isArray(els) ? els[0] : els;
            if (el) el.focus();
          }
        }

        function closeInlineInsert() {
          inlineInsertAt.value = null;
          inlineText.value = '';
        }

        async function saveInlineAnnotation(afterTranscriptionId) {
          const text = inlineText.value.trim();
          if (!text) return;
          try {
            const res = await fetch('/api/annotations', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                after_transcription_id: afterTranscriptionId,
                text,
              }),
            });
            const anno = await res.json();
            annotations.value.push(anno);
            closeInlineInsert();
          } catch (err) {
            console.error('Failed to save annotation:', err);
          }
        }

        // --- Bottom note ---

        function handleBottomKeydown(e) {
          if (e.key === 'Tab') {
            e.preventDefault();
            const ta = e.target;
            const start = ta.selectionStart;
            const end = ta.selectionEnd;
            const val = bottomNoteText.value;
            bottomNoteText.value = val.substring(0, start) + '  ' + val.substring(end);
            nextTick(() => {
              ta.selectionStart = ta.selectionEnd = start + 2;
            });
          }
        }

        async function saveBottomNote() {
          const text = bottomNoteText.value.trim();
          if (!text) return;

          // Anchor after the last transcription
          const lastTrans = transcriptions.value.length > 0
            ? transcriptions.value[transcriptions.value.length - 1]
            : null;

          try {
            const res = await fetch('/api/annotations', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                after_transcription_id: lastTrans ? lastTrans.id : null,
                text,
              }),
            });
            const anno = await res.json();
            annotations.value.push(anno);
            bottomNoteText.value = '';
            await scrollToBottom();
          } catch (err) {
            console.error('Failed to save note:', err);
          }
        }

        // --- Edit annotation ---

        function getEditEl() {
          const els = editInputEl.value;
          if (!els) return null;
          return Array.isArray(els) ? els[0] : els;
        }

        function autoResizeEdit() {
          const el = getEditEl();
          if (!el) return;
          el.style.height = 'auto';
          el.style.height = el.scrollHeight + 'px';
        }

        async function startEdit(item) {
          editingAnnotationId.value = item.id;
          editingText.value = item.text;
          await nextTick();
          const el = getEditEl();
          if (el) {
            el.focus();
            el.style.height = 'auto';
            el.style.height = el.scrollHeight + 'px';
          }
        }

        function handleEditKeydown(e, id) {
          if (e.key === 'Escape') {
            cancelEdit();
          } else if (e.key === 'Tab') {
            e.preventDefault();
            const ta = e.target;
            const start = ta.selectionStart;
            const end = ta.selectionEnd;
            const val = editingText.value;
            editingText.value = val.substring(0, start) + '  ' + val.substring(end);
            nextTick(() => {
              ta.selectionStart = ta.selectionEnd = start + 2;
              autoResizeEdit();
            });
          }
          // Enter adds a new line by default (no special handling needed)
          // Save via the Save button
          if (e.key === 'Enter') {
            nextTick(() => autoResizeEdit());
          }
        }

        // --- Inline note keydown + auto-resize ---

        function handleInlineKeydown(e, afterId) {
          if (e.key === 'Escape') {
            closeInlineInsert();
          } else if (e.key === 'Tab') {
            e.preventDefault();
            const ta = e.target;
            const start = ta.selectionStart;
            const end = ta.selectionEnd;
            const val = inlineText.value;
            inlineText.value = val.substring(0, start) + '  ' + val.substring(end);
            nextTick(() => {
              ta.selectionStart = ta.selectionEnd = start + 2;
              autoResizeInline();
            });
          }
          if (e.key === 'Enter') {
            nextTick(() => autoResizeInline());
          }
        }

        function autoResizeInline() {
          const els = inlineInputEl.value;
          if (!els) return;
          const el = Array.isArray(els) ? els[0] : els;
          if (!el) return;
          el.style.height = 'auto';
          el.style.height = el.scrollHeight + 'px';
        }

        function cancelEdit() {
          editingAnnotationId.value = null;
          editingText.value = '';
        }

        async function saveEdit(id) {
          const text = editingText.value.trim();
          if (!text) return;
          try {
            const res = await fetch('/api/annotations/' + id, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ text }),
            });
            const updated = await res.json();
            const idx = annotations.value.findIndex(a => a.id === id);
            if (idx !== -1) annotations.value[idx] = updated;
            cancelEdit();
          } catch (err) {
            console.error('Failed to update annotation:', err);
          }
        }

        // --- Delete annotation ---

        async function deleteAnnotation(id) {
          try {
            await fetch('/api/annotations/' + id, { method: 'DELETE' });
            annotations.value = annotations.value.filter(a => a.id !== id);
          } catch (err) {
            console.error('Failed to delete annotation:', err);
          }
        }

        onUnmounted(() => stopPolling());

        // Initial load
        fetchDates();
        fetchAll();

        return {
          dates,
          items,
          transcriptionCount,
          selectedDate,
          searchInput,
          loading,
          messagesEl,
          inlineInputEl,
          editInputEl,
          bottomTextarea,
          toolbarTitle,
          inlineInsertAt,
          inlineText,
          editingAnnotationId,
          editingText,
          bottomNoteText,
          formatDateLabel,
          formatTime,
          highlightText,
          selectDate,
          selectAll,
          onSearchInput,
          openInlineInsert,
          closeInlineInsert,
          saveInlineAnnotation,
          handleInlineKeydown,
          autoResizeInline,
          handleBottomKeydown,
          saveBottomNote,
          startEdit,
          handleEditKeydown,
          autoResizeEdit,
          cancelEdit,
          saveEdit,
          deleteAnnotation,
        };
      },
    }).mount('#app');
  </script>
</body>
</html>
