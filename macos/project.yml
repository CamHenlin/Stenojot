name: ParakeetTranscriber
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    ARCHS: arm64
    CODE_SIGN_IDENTITY: ParakeetTranscriberDev
    # Search this keychain for the identity created by ensure-codesign-identity.sh.
    OTHER_CODE_SIGN_FLAGS: "--keychain $(SRCROOT)/.codesign/codesign.keychain-db"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: "YES"
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: NO
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ONLY_ACTIVE_ARCH: NO
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_VERSION: "5.0"
packages:
  TranscriberCore:
    path: TranscriberCore
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.31.4
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
targets:
  Transcriber:
    type: application
    platform: macOS
    sources:
      - path: Transcriber
        excludes:
          - Info.plist
    dependencies:
      - package: TranscriberCore
        product: TranscriberCore
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: ""
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Transcriber/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.parakeet.transcriber
        PRODUCT_NAME: Parakeet Transcriber
    preBuildScripts:
      - path: Scripts/ensure-codesign-identity.sh
        name: Stable code signing identity
        shell: /bin/bash
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - path: Scripts/bundle-resources.sh
        name: Bundle Python and sidecar
        basedOnDependencyAnalysis: false
schemes:
  ParakeetTranscriber:
    build:
      targets:
        Transcriber: all
    run:
      config: Debug
